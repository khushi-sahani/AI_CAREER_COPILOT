{% extends "base.html" %}

{% block content %}
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class= "sub-text">
                Start your AI Career Copilot journey by creating an account. It's quick and easy!
            </p>
            <form method="POST">
                <input type="email" name="email" placeholder="Enter your email" required>
                <input type="password" name="password" placeholder="Create aPassword" required>
                <p class="sub-text"> Use atleast 6 characters</p>
                <button type="submit">Sign Up</button>
            </form>
            <p class="switch-auth" >
                Already have an account? <a href="/login">Log In</a>
            </p>
        </div>
    </div>
{% endblock %}
